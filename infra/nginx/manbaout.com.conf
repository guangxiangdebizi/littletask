server {
    listen 80;
    listen [::]:80;
    server_name manbaout.com www.manbaout.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://manbaout.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.manbaout.com;

    ssl_certificate /etc/letsencrypt/live/manbaout.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/manbaout.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://manbaout.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name manbaout.com;

    ssl_certificate /etc/letsencrypt/live/manbaout.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/manbaout.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /srv/littletask/current/apps/mobile/dist;
    index index.html;
    client_max_body_size 11m;
    limit_req_status 429;
    limit_conn littletask_connections 30;
    include /etc/nginx/snippets/littletask-security-headers.conf;

    location = /api/metrics {
        return 404;
    }

    location = /api/v1/auth/device {
        limit_req zone=littletask_registration burst=5 nodelay;
        proxy_pass http://127.0.0.1:3100;
        include /etc/nginx/snippets/littletask-proxy.conf;
        include /etc/nginx/snippets/littletask-security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    location = /api/v1/intakes {
        limit_req zone=littletask_upload burst=5 nodelay;
        proxy_pass http://127.0.0.1:3100;
        include /etc/nginx/snippets/littletask-proxy.conf;
        include /etc/nginx/snippets/littletask-security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    location /api/ {
        limit_req zone=littletask_general burst=30 nodelay;
        proxy_pass http://127.0.0.1:3100;
        include /etc/nginx/snippets/littletask-proxy.conf;
        include /etc/nginx/snippets/littletask-security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    location = /webmail {
        return 308 /webmail/;
    }

    location ^~ /webmail/ {
        proxy_pass http://127.0.0.1:8082/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /webmail;
        proxy_read_timeout 300s;
    }

    location ^~ /_expo/static/ {
        try_files $uri =404;
        include /etc/nginx/snippets/littletask-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        try_files $uri $uri.html $uri/ /index.html;
        include /etc/nginx/snippets/littletask-security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }
}
