name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://littletask:littletask@127.0.0.1:5432/littletask_test?schema=public
      TEST_DATABASE_URL: postgresql://littletask:littletask@127.0.0.1:5432/littletask_test?schema=public

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: littletask_test
          POSTGRES_USER: littletask
          POSTGRES_PASSWORD: littletask
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U littletask -d littletask_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.0.9
        with:
          version: 9.15.9
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Apply PostgreSQL migrations
        run: pnpm db:migrate:deploy

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Test PostgreSQL persistence
        run: pnpm test:integration

      - name: Build
        run: pnpm build
