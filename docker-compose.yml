services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: littletask
      POSTGRES_USER: littletask
      POSTGRES_PASSWORD: littletask
    ports:
      - '5432:5432'
    volumes:
      - littletask-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U littletask -d littletask']
      interval: 5s
      timeout: 3s
      retries: 10

  postgres-test:
    image: postgres:17-alpine
    profiles: ['test']
    environment:
      POSTGRES_DB: littletask_test
      POSTGRES_USER: littletask
      POSTGRES_PASSWORD: littletask
    ports:
      - '5433:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U littletask -d littletask_test']
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  littletask-postgres:
